    ];

  }
  function stage(w){return w<=2?{name:'适应期',label:'建立动作基础',frequency:2}:w<=4?{name:'基础期',label:'稳定全身训练',frequency:3}:{name:'强化期',label:'上下肢分化',frequency:4};}
  function remaining(timer,now=Date.now()){if(!timer)return 0;if(timer.paused!=null)return Math.max(0,Math.ceil(timer.paused));return Math.max(0,Math.ceil((timer.endAt-now)/1000));}

    for(const b of s.body)if(!object(b)||!isDate(b.date)||!numberIn(b.weight,30,350)||(b.waist!==null&&!numberIn(b.waist,30,250)))throw new Error('体测记录无效');

    if(!unique(s.body,'date')||!unique(s.meals,'id')||!unique(s.recovery,'date'))throw new Error('备份含重复记录标识');
    if(s.active!==null&&!object(s.active))throw new Error('进行中训练格式无效');

      if(!object(session)||typeof session.title!=='string'||!session.title.trim()||session.title.length>100||!Number.isInteger(session.week)||!numberIn(session.week,1,12)||!isDate(session.date)||!Array.isArray(session.items)||!session.items.length||session.items.length>30||!numberIn(session.startedAt,0,9999999999999))throw new Error('训练记录无效');

        for(const set of it.sets){if(!object(set)||(set.weight!==''&&!numberIn(set.weight,0,1000))||!numberIn(set.reps,0,600)||!numberIn(set.rir,0,5)||typeof set.done!=='boolean'||(set.done&&(set.weight===''||set.reps<=0)))throw new Error('训练组数值无效');}

    if(!unique(s.history,'logId'))throw new Error('历史训练标识重复');
    if(s.videoOverrides!==undefined&&!object(s.videoOverrides))throw new Error('视频替换格式无效');
    const overrides={};for(const [k,v] of Object.entries(s.videoOverrides||{})){if(!hasExercise(k)||!isVideoUrl(v))throw new Error('视频替换仅支持B站单视频地址');overrides[k]=v;}
    // Import only known top-level fields; no executable code or prototype fields.
    const clean=JSON.parse(JSON.stringify({schema:1,profile:p,history:s.history,active:s.active,body:s.body,meals:s.meals,recovery:s.recovery,videoOverrides:overrides,timer:null,cooking:s.cooking===undefined?FitCook.defaults():FitCook.validate(s.cooking)}));return clean;
  }
  function lastSets(history,id){for(let i=history.length-1;i>=0;i--){const e=history[i].items.find(x=>x.id===id);if(e&&e.sets.some(s=>s.done))return e.sets.filter(s=>s.done);}return [];}
  function newSession(p,history,date=localDate()){return {key:p.key,week:p.week,date,title:p.title,startedAt:Date.now(),items:p.exercises.map(e=>{const old=lastSets(history,e.id);const body=FitData.exercises[e.id].bodyweight;return {...e,sets:Array.from({length:e.sets},(_,i)=>({weight:old[i]?.weight??old[0]?.weight??(body?0:''),reps:e.min,rir:3,done:false}))};})};}

  return {localDate,defaults,plan,stage,remaining,nutrition,sessionStats,bodyTrend,isVideoUrl,numberIn,isDate,validateBackup,lastSets,newSession,escape};
})();

ss="section-head"><h2>今天的补给</h2><span class="chip green">饮食记录</span></div><div class="muted small">已记录热量</div><div class="nutrition-big"><strong>${fmt(total.kcal)}</strong><span>/ ${p.kcal} kcal</span></div><div class="bar"><span style="width:${pct(total.kcal,p.kcal)}%"></span></div>${macros(total)}${button(`${I('plus',15)}记录一餐`,'data-action="meal" style="width:100%;margin-top:21px"')}<p class="caption">目标是可调整的估计起点，不是测得的维持热量。</p></section><section class="card"><div class="section-head"><h2>恢复，也是训练。</h2>${I('leaf',20)}</div><p class="muted small">睡够、吃好，下一次才有更好的状态。</p><div class="mini-grid"><div class="mini-card">${I('moon',18)}<div><small>今天睡眠</small><strong>${r?fmt(r.sleep)+'小时':'尚未记录'}</strong></div></div><div class="mini-card">${I('heart',18)}<div><small>主观疲劳</small><strong>${r?r.fatigue+' / 5':'尚未记录'}</strong></div></div></div>${button('记录恢复状态 '+I('arrow',14),'data-action="recovery" style="margin-top:12px"','ghost')}<div class="callout" style="margin-top:10px">工作走动多的当天，<b>不强制叠加长时间有氧</b>。</div></section></div></div>${next?`<section class="card mt"><div class="section-head"><div><h2>下一节 · ${next.title}</h2><p class="muted small" style="margin-top:4px">每个动作，都有独立中文教学。</p></div><span class="chip">${next.exercises.reduce((n,e)=>n+e.sets,0)}个正式组</span></div><div class="exercise-list">${next.exercises.map(exerciseLine).join('')}</div><p class="two-line">热身5–10分钟；正式组不含热身组。首次重量从轻开始，完成后还可标准做2–3次。</p></section>`:''}${footer()}`;}
function renderPlan(){const w=previewWeek,st=C.stage(w),plan=C.plan(w);return `${pageTitle('12 WEEK ROADMAP','一周一周，稳步向前。','周数手动选择；恢复不足时可以重复当前周，不自动加量。')}<div class="stage-banner">${[[1,2,'适应期','每周2次 · 全身'],[3,4,'基础期','每周3次 · 全身'],[5,12,'强化期','每周4次 · 上下肢']].map(([a,b,t,n])=>`<div class="stage-piece ${w>=a&&w<=b?'selected':''}"><small>WEEK ${a}–${b}</small><strong>${t}</strong><span class="small muted">${n}</span></div>`).join('')}</div><div class="card"><div class="section-head"><h2>选择计划周</h2><span class="muted">当前执行第${state.profile.week}周</span></div><div class="week-picker">${Array.from({length:12},(_,i)=>`<button class="week-btn ${w===i+1?'active':''}" data-week="${i+1}" aria-pressed="${w===i+1}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div><div class="between"><div><strong>第${w}周 · ${st.name}</strong><div class="small muted">下方显示本周${plan.length}节训练；建议日期可以顺延。</div></div>${w!==state.profile.week?button('使用这一周','data-action="adopt-week"','small primary'):'<span class="chip green">正在执行</span>'}</div></div><div class="mt">${plan.map((s,i)=>`<details class="plan-session" ${i===0?'open':''}><summary><span class="session-letter">${s.id}</span><div><h3>${s.title}</h3><p class="small muted">建议${s.day} · ${s.minutes}分钟 · ${s.focus}</p></div>${I('chevron',18)}</summary><div class="plan-inside">${s.exercises.map(exerciseLine).join('')}<div class="between"><span class="muted small">组间休息60–150秒 · 留2–3次余力</span>${button('开始这一节',`data-start="${s.key}"`,'primary small')}</div></div></details>`).join('')}</div><div class="equal-cols mt"><div class="callout"><b>重量怎么加？</b><br>同一重量连续两次训练达到所有组的次数上限，动作稳定且仍有余力，再尝试增加器械最小一档；不满足就继续原重量。哑铃记录单只重量。</div><div class="callout"><b>什么时候顺延？</b><br>下夜班、明显缺觉、疲劳积累或酸痛影响动作时，优先恢复。同肌群训练尽量间隔约48小时；腿部刺痛不是“练到位”。</div></div><div class="callout mt"><b>有氧安排</b><br>非力量日、精神和腿部恢复良好时，选单车、椭圆机或快走20–30分钟，强度以还能说完整一句话为准。工作走动多或下夜班时可取消，不硬凑额外步数。</div>${footer()}`;}
function videoTiles(){const arr=Object.entries(D.exercises).filter(([id,e])=>(videoGroup==='全部'||e.group===videoGroup)&&`${e.name}${e.equipment}${e.author}`.toLowerCase().includes(videoQuery.toLowerCase()));return arr.length?arr.map(([id,e])=>`<article class="video-tile"><div class="video-art">${I(groupIcon(e.group),40)}<span class="group-name">${e.group} / ${e.equipment}</span><span class="play-circle">${I('play',18)}</span></div><div class="video-info"><h3>${e.name}</h3><p>${e.author} · B站中文</p>${button(`${I('play',14)}单动作教学`,`data-detail="${id}"`)}<div class="verification">独立视频 · 非合集 / 非搜索页</div></div></article>`).join(''):`<div class="empty" style="grid-column:1/-1">没有匹配动作，试试“推胸”“腿”或“哑铃”。</div>`;}
function renderVideos(){return `${pageTitle('LEARN THE MOVEMENT','每个动作，一条教学。','17个动作独立入口，练之前先看要点。','<input id="video-search" class="search-box" type="search" placeholder="搜索动作、器械或作者" aria-label="搜索教学动作" value="'+E(videoQuery)+'">')}<div class="filter-row">${['全部','胸部','背部','肩部','腿臀','手臂','核心'].map(g=>`<button class="filter-btn ${g===videoGroup?'active':''}" data-group="${g}">${g}</button>`).join('')}</div><div class="video-grid" id="video-grid">${videoTiles()}</div><div class="callout mt">入口已按公开标题核对；<b>不是逐段审看或全片播放保证</b>。点击后打开对应单条视频，部分视频属于作者系列，但不是合集页。视频由B站和原作者提供，失效时可在详情里更换单条链接。</div>${footer()}`;}
let cookResult=null,cookConfig=null,recipeToLog=null;
function saveCooking(next){const previous=state;state=next;if(!save()){state=previous;throw new Error('浏览器未能保存，本次更改未写入。请先导出备份并检查存储空间。');}}
function cookingSafety(){return `<details class="cook-safety"><summary>${I('shield',17)}冷冻鸡胸肉，先安全解冻</summary><p><b>优先冷藏解冻：</b>放在不高于4℃的冰箱冷藏室，用容器接住汁液，等待完全解冻。冷藏解冻可能需要一天或更久，不能只看表面变软。</p><p><b>赶时间可冷水解冻：</b>装入防漏袋，浸在冷水中，每30分钟换水，解冻后立即烹调。不要在室温、台面或热水中解冻。</p><p><b>空气炸锅180℃、12–16分钟：</b>仅为完全解冻后、厚约1.5–2cm鸡胸肉的起始参考，中途翻面，不包含解冻时间。设备、厚度和装量都会改变用时；多份需单层分批，不能堆叠后照搬时间。</p><p><b>最厚处中心温度至少74℃：</b>用食品温度计实测；未达到就继续加热并复测。炒锅也一样，不能凭时间、颜色保证熟透。生熟刀板和餐具分开，接触生肉后清洁双手与台面。鸡蛋蛋白、蛋黄均需充分凝固。</p><p><a href="https://www.fda.gov/food/buy-store-serve-safe-food/safe-food-handling" target="_blank" rel="noopener noreferrer">FDA 食品处理指引 ↗</a> · <a href="https://www.foodsafety.gov/food-safety-charts/safe-minimum-internal-temperatures" target="_blank" rel="noopener noreferrer">安全中心温度依据 ↗</a> · <a href="https://ask.fsis.usda.gov/article/What-is-a-fast-way-to-thaw-food" target="_blank" rel="noopener noreferrer">USDA 冷水解冻 ↗</a></p></details>`;}
function renderCooking(){const c=state.cooking;return `<section class="card cook-panel" aria-labelledby="cook-title"><div class="cook-heading"><div><span class="chip green">减脂保肌 · 家常做饭</span><h2 id="cook-title" style="margin-top:12px">用手边食材，做好这一餐。</h2><p>智能做饭 · 按食材与器具本地匹配，无需联网。</p></div>${button(`${I('heart',15)}我的收藏（${c.favorites.length}）`,'data-action="cook-favorites"','small')}</div><div class="cook-layout"><form id="cook-form"><div class="form-grid"><label class="form-field full">我现有的食材<textarea name="ingredients" rows="3" maxlength="500" required aria-describedby="cook-input-help">${E(c.ingredients)}</textarea><small id="cook-input-help">只填食材名称，用顿号、逗号或换行分隔。下方菜谱给出建议克数，不读取库存数量。</small></label><fieldset class="cook-tools form-field full"><legend>选择可用器具，可多选</legend><div class="cook-tools-row"><label><input type="checkbox" name="tools" value="wok" ${c.tools.includes('wok')?'checked':''}>炒锅</label><label><input type="checkbox" name="tools" value="airfryer" ${c.tools.includes('airfryer')?'checked':''}>空气炸锅</label></div></fieldset>${field('做几份','servings',c.servings,'number','min="1" max="6" step="1" required')}${field('每份用油（克）','oil',c.oil,'number','min="0" max="20" step="0.5" required')}</div><div id="cook-error" class="form-error cook-error" role="alert"></div><button type="submit" class="btn primary cook-submit">${I('bowl',18)}生成菜谱</button><p class="caption">支持鸡胸肉、洋葱、鸡蛋、杂粮馒头等常见食材。未识别的食材会列出；调味料按实际另计，食用油已纳入估算。</p></form><aside class="cook-intro"><div>${I('bowl',34)}<h3>吃得够，也吃得明白。</h3><p>先选器具，再看每份营养。<br>按步骤做完，记录实际吃下的份量。</p></div><p>收藏用于下次参考；生成和收藏菜谱都不会自动增加今天的摄入。</p></aside></div><div id="cook-results" class="cook-results" aria-live="polite">${cookResult?renderCookResults():''}</div>${cookingSafety()}</section>`;}
function recipeMacros(n){return `<div class="recipe-energy">${fmt(n.kcal)} <small>kcal / 份 · 估算</small></div><div class="recipe-macros">${[['protein','蛋白质'],['carbs','碳水'],['fat','脂肪']].map(([k,t])=>`<div><span>${t}</span><b>${fmt(n[k])}g</b></div>`).join('')}</div>`;}
function recipeSignature(id,config){return JSON.stringify([id,config.ingredients,config.tools,config.servings,config.oil]);}
function favoriteFor(r){return state.cooking.favorites.find(f=>recipeSignature(f.recipeId,f.config)===recipeSignature(r.id,cookConfig));}
function renderCookResults(){const r=cookResult;return `${r.unknown.length?`<div class="callout warning">暂未识别：${r.unknown.map(E).join('、')}。这些食材没有计入菜谱和营养。</div>`:''}${(r.notices||[]).map(n=>`<p class="caption">${E(n)}</p>`).join('')}${r.recipes.length?`<p class="caption">${r.recognized.map(E).join('、')} · 以下方案任选其一，按 ${cookConfig.servings} 份准备。</p><div class="recipe-grid">${r.recipes.map(x=>`<article class="recipe-card"><span class="chip neutral">${E(x.method)}</span><h3>${E(x.title)}</h3><div class="recipe-meta">${E(x.temp)} · ${E(x.time)}<br>备餐 ${x.servings} 份 · 下列营养为每份</div>${recipeMacros(x.nutrition)}<p class="recipe-note">${x.items.map(it=>`${E(it.name)} ${fmt(it.grams)}g`).join('、')}<br>以上为整次备餐用量；详见步骤中的称重口径。</p>${x.items.some(it=>it.name.includes('鸡胸'))?'<p class="recipe-note" style="margin-top:10px"><b>鸡肉需完全解冻；最厚处中心实测至少74℃，时间仅供参考。</b></p>':''}<div class="recipe-actions">${button('查看步骤',`data-cook-detail="${E(x.id)}"`,'primary')}${button(favoriteFor(x)?'已收藏':'收藏',`data-cook-favorite="${E(x.id)}" aria-pressed="${!!favoriteFor(x)}"`)}${button('记录这餐',`data-cook-record="${E(x.id)}"`)}</div></article>`).join('')}</div>`:'<div class="empty">这些食材和器具暂未匹配到菜谱。<br>请使用支持的食材名称，或手动记录这一餐。</div>'}<p class="caption">营养按常见食材参考值计算，并非实测。品牌、配方及实际用量会改变结果；有包装标签时优先按标签校正。单餐不保证减脂或保肌，仍需结合全天饮食和训练。</p>`;}
function getCookRecipe(id){return cookResult?.recipes.find(r=>r.id===id);}
function recipeDetail(id){const r=getCookRecipe(id);if(!r)return;showModal(E(r.title),`<div class="flex wrap"><span class="chip green">${E(r.method)}</span><span class="chip neutral">备餐 ${r.servings} 份</span></div>${recipeMacros(r.nutrition)}<h3>备好食材 · 以下为 ${r.servings} 份总量</h3><ul class="recipe-ingredients">${r.items.map(i=>`<li><span>${E(i.name)}<small>${E(i.note||'')}</small></span><b>${fmt(i.grams)}g</b></li>`).join('')}</ul><p class="caption">整次备餐约 ${fmt(r.totalNutrition.kcal)} kcal · 蛋白质 ${fmt(r.totalNutrition.protein)}g · 碳水 ${fmt(r.totalNutrition.carbs)}g · 脂肪 ${fmt(r.totalNutrition.fat)}g。</p><div class="callout"><b>${E(r.temp)}</b><br>${E(r.time)}。时间仅供安排操作，熟度需按步骤检查。</div><h3 style="margin-top:20px">跟着步骤做</h3><ol class="recipe-steps">${r.steps.map(s=>`<li>${E(s)}</li>`).join('')}</ol>${r.notes.map(n=>`<p class="caption">${E(n)}</p>`).join('')}${cookingSafety()}<div class="form-actions">${button(favoriteFor(r)?'已收藏':'收藏菜谱',`data-cook-favorite="${E(id)}"`)}${button('记录这餐',`data-cook-record="${E(id)}"`,'primary')}</div>`);}
function recordRecipe(id){const r=getCookRecipe(id);if(!r)return;recipeToLog=JSON.parse(JSON.stringify(r));showModal('记录实际吃下的份量',`<form id="recipe-log-form"><p class="caption">${E(r.title)} · 本次共做 ${r.servings} 份。按均分后的“1份”计算，只记录自己实际吃下的量。</p><div class="form-grid" style="margin-top:16px">${field('记录日期','recipeDate',C.localDate(),'date','required',true)}${field('实际吃了几份','portions',1,'number','min="0.25" max="12" step="0.25" required',true)}</div><div id="recipe-log-total" class="recipe-total"></div><p class="caption">半份填0.5，两份填2。这里按菜谱配方估算；实际配料、份量或包装标签不同，可关闭后使用“记录一餐”手动填写。</p><div class="form-actions"><button type="submit" class="btn primary">保存饮食</button></div></form>`);updateRecipeLogTotal();}
function updateRecipeLogTotal(){const n=Number(document.querySelector('#recipe-log-form [name="portions"]')?.value),el=document.getElementById('recipe-log-total');if(!el||!recipeToLog)return;if(!C.numberIn(n,.25,12)||!Number.isInteger(n*4)){el.textContent='请输入0.25至12份，按0.25份递增。';return;}const v=recipeToLog.nutrition;el.textContent=`本次约 ${fmt(Math.round(v.kcal*n*10)/10)} kcal · 蛋白质 ${fmt(Math.round(v.protein*n*10)/10)}g · 碳水 ${fmt(Math.round(v.carbs*n*10)/10)}g · 脂肪 ${fmt(Math.round(v.fat*n*10)/10)}g（估算）`;}
function cookingFavorites(){showModal('我的菜谱收藏',state.cooking.favorites.length?state.cooking.favorites.map(f=>`<div class="cook-favorite-row"><strong>${E(f.title)}</strong><p>${E(f.config.ingredients)} · ${f.config.servings}份 · 每份油${f.config.oil}g</p><div class="flex wrap">${button('打开菜谱',`data-cook-open="${E(f.key)}"`,'small primary')}${button('取消收藏',`data-cook-remove="${E(f.key)}"`,'small')}</div></div>`).join(''):'<div class="empty">还没有收藏。生成菜谱后点“收藏”，下次可以直接打开。</div>');}
function toggleCookFavorite(id){const r=getCookRecipe(id);if(!r)return;if(loadError){toast('原有数据尚未恢复，请先导出原始存储或导入有效备份。');return;}try{const old=favoriteFor(r);let favorites=state.cooking.favorites.filter(f=>f.key!==old?.key);if(!old){if(favorites.length>=100){toast('最多收藏100道菜谱，请先取消部分收藏。');return;}favorites.push({key:uid(),title:r.title,recipeId:id,config:{ingredients:cookConfig.ingredients,tools:[...cookConfig.tools],servings:cookConfig.servings,oil:cookConfig.oil}});}saveCooking({...state,cooking:{...state.cooking,favorites}});const opened=document.getElementById('modal').open;render();if(opened)recipeDetail(id);toast(old?'已取消收藏。':'已收藏，完整备份也会包含这道菜谱。');}catch(e){toast(e.message);}}
document.addEventListener('click',event=>{const n=event.target.closest('button');if(!n)return;if(n.dataset.cookDetail)recipeDetail(n.dataset.cookDetail);else if(n.dataset.cookRecord)recordRecipe(n.dataset.cookRecord);else if(n.dataset.cookFavorite)toggleCookFavorite(n.dataset.cookFavorite);else if(n.dataset.action==='cook-favorites')cookingFavorites();else if(n.dataset.cookOpen){const f=state.cooking.favorites.find(x=>x.key===n.dataset.cookOpen);if(!f)return;cookConfig=FitCook.validate({...f.config,favorites:[]});cookResult=FitCook.generate(cookConfig);page='nutrition';render();recipeDetail(f.recipeId);}else if(n.dataset.cookRemove){if(loadError)return;try{saveCooking({...state,cooking:{...state.cooking,favorites:state.cooking.favorites.filter(f=>f.key!==n.dataset.cookRemove)}});render();cookingFavorites();}catch(e){toast(e.message);}}});
document.addEventListener('input',event=>{if(event.target.matches('#recipe-log-form [name="portions"]'))updateRecipeLogTotal();});
document.addEventListener('submit',event=>{const f=event.target;if(f.id!=='cook-form'&&f.id!=='recipe-log-form')return;event.preventDefault();try{if(loadError)throw new Error('原有数据尚未恢复，已阻止覆盖。请先在备份中导出原始存储或导入有效备份。');const data=new FormData(f);if(f.id==='cook-form'){const config=FitCook.validate({ingredients:String(data.get('ingredients')||'').trim(),tools:data.getAll('tools'),servings:Number(data.get('servings')),oil:Number(data.get('oil')),favorites:state.cooking.favorites});const result=FitCook.generate(config);saveCooking({...state,cooking:config});cookConfig=config;cookResult=result;render();document.getElementById('cook-results')?.scrollIntoView({behavior:'smooth',block:'start'});}else{if(!recipeToLog)return;const amount=Number(data.get('portions')),date=String(data.get('recipeDate'));if(!C.numberIn(amount,.25,12)||!Number.isInteger(amount*4))throw new Error('请输入0.25至12份，按0.25份递增。');if(!C.isDate(date))throw new Error('请选择有效日期。');const meal={id:uid(),date,name:`${recipeToLog.title} · ${amount}份（估算）`};for(const k of ['kcal','protein','carbs','fat'])meal[k]=Math.round(recipeToLog.nutrition[k]*amount*10)/10;C.validateBackup({...state,meals:[...state.meals,meal]});saveCooking({...state,meals:[...state.meals,meal]});recipeToLog=null;closeModal();render();toast('已计入饮食记录和当日营养统计。');}}catch(e){if(f.id==='cook-form')document.getElementById('cook-error').textContent=e.message;else formErrors(e.message);}});

function renderNutrition(){const date=C.localDate(),total=C.nutrition(state.meals,date),meals=state.meals.filter(x=>x.date===date),r=state.recovery.find(x=>x.date===date);return `${pageTitle('FUEL & RECOVERY','训练之外，也认真一点。','记录真实吃下的食物，不把模板餐单当成实际摄入。',button(`${I('plus',15)}记录一餐`,'data-action="meal"','primary'))}${renderCooking()}<div class="nutrition-overview">${[['kcal','热量','kcal','bowl'],['protein','蛋白质','g','dumbbell'],['carbs','碳水','g','leaf'],['fat','脂肪','g','heart']].map(([key,title,unit,icon])=>`<div class="card nutrition-stat"><div class="stat-label">${title}${I(icon,17)}</div><div class="stat-value">${fmt(total[key])}<small>/ ${state.profile[key]} ${unit}</small></div><div class="bar" style="margin-top:12px"><span style="width:${pct(total[key],state.profile[key])}%"></span></div></div>`).join('')}</div><div class="equal-cols"><section class="card"><div class="section-head"><h2>今天吃了什么</h2><span class="muted">${date}</span></div>${meals.length?meals.map(m=>`<div class="meal-row"><div class="history-badge">${I('bowl',18)}</div><div class="entry-text"><strong>${E(m.name)}</strong><p>蛋白${fmt(m.protein)}g · 碳水${fmt(m.carbs)}g · 脂肪${fmt(m.fat)}g</p></div><strong class="small">${fmt(m.kcal)} kcal</strong><button class="text-delete" data-delete-meal="${E(m.id)}" aria-label="删除${E(m.name)}">${I('trash',16)}</button></div>`).join(''):`<div class="empty">${I('bowl',30)}还没有饮食记录<br>按包装营养表或实际估算填写，不自动猜热量。</div>`}<p class="caption">手动记录和菜谱估算都会计入统计；4/4/9换算与标签可能有舍入差异。</p>${button('查看全部饮食记录','data-action="all-meals"','ghost')}</section><section class="card"><div class="section-head"><h2>恢复状态</h2>${button('记录','data-action="recovery"','small')}</div><div class="recovery-icons"><div class="muted small">${I('moon',17)} 主睡眠<strong class="mono">${r?fmt(r.sleep):'—'}<small> 小时</small></strong></div><div class="muted small">${I('heart',17)} 主观疲劳<strong class="mono">${r?r.fatigue:'—'}<small> / 5</small></strong></div></div><div class="callout">${r&&r.sleep<6?'已记录睡眠不足6小时：今天优先补觉，训练可顺延，不为了打卡硬练。':'尽量每24小时累计7–9小时睡眠。倒班时优先保证主睡眠，训练安排在睡醒且精神较好时。'}</div>${r?.note?`<p class="caption">你的备注：${E(r.note)}</p>`:''}<p class="caption">无自动健康数据连接。恢复记录是自我观察，不是医学评分。</p></section></div><div class="equal-cols mt"><section class="card"><div class="section-head"><h2>日常搭配参考</h2><span class="chip neutral">未计入摄入</span></div>${[['早餐','鸡蛋、牛奶、燕麦＋一份水果','三餐分配蛋白质，不必空腹训练。'],['午餐','米饭＋瘦肉或鱼＋蔬菜','实际份量、烹调油和酱料一并记录。'],['练前','香蕉、酸奶等方便消化的食物','结合饥饿程度与正餐时间安排。'],['晚餐','主食＋鱼肉或豆制品＋蔬菜','不要为了减脂完全停掉碳水。']].map(([name,food,note])=>`<div class="meal-example"><b>${name}</b><div>${food}<p>${note}</p></div></div>`).join('')}</section><section class="card"><h2>用趋势，调整饮食。</h2><div class="callout mt"><b>2500千卡只是初始估计。</b><br>先记录两周，再结合平均体重、腰围、饥饿感和力量表现调整。不要把手表的活动热量全部加回餐单。</div><div class="callout mt">连续两周体重趋势不降，且记录可靠，可小幅减少约150–200千卡；明显疲劳、力量持续下降或减重过快时，应重新评估而非继续加码。</div><p class="caption">蛋白质预设160g，来自前面的计划；不是根据化验或体脂测得。已知肾病或其他需要限制饮食的情况，应先请专业人员个体化调整。</p>${button('调整饮食目标','data-action="settings"','ghost')}</section></div>${footer()}`;}
function weightChart(){const b=C.bodyTrend(state.body).list;if(b.length<2)return `<div class="empty">${I('chart',31)}<div>${b.length?'已记录1次，再记录一次就能看趋势。':'还没有体测记录。'}<br>这里只展示真实记录，不预画减重结果。</div></div>`;const width=600,height=190,pad=30;const lo=Math.min(...b.map(x=>x.weight))-1,hi=Math.max(...b.map(x=>x.weight))+1;const vals=b.map((x,i)=>({x:pad+i/(b.length-1)*(width-pad*2),y:height-pad-(x.weight-lo)/(hi-lo)*(height-pad*2),weight:x.weight}));return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="体重记录趋势，起点${b[0].weight}公斤，最近${b.at(-1).weight}公斤">${[0,1,2].map(i=>{const y=pad+i*(height-pad*2)/2;return `<line x1="30" y1="${y}" x2="570" y2="${y}" stroke="#e8eee2" stroke-dasharray="4 5"/><text x="0" y="${y+4}" class="axis-label">${(hi-i*(hi-lo)/2).toFixed(1)}</text>`;}).join('')}<polyline points="${vals.map(v=>`${v.x},${v.y}`).join(' ')}" fill="none" stroke="#709c44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map(v=>`<circle cx="${v.x}" cy="${v.y}" r="4" fill="#709c44" stroke="white" stroke-width="2"/>`).join('')}</svg><div class="plot-labels"><span>${b[0].date}</span><span>kg · 每次实测</span><span>${b.at(-1).date}</span></div>`;}
function renderProgress(){const trend=C.bodyTrend(state.body),count=state.history.filter(s=>s.completed).length,sets=state.history.reduce((n,s)=>n+C.sessionStats(s).done,0);return `${pageTitle('SMALL WINS, REAL PROGRESS','让变化，有迹可循。','看体重与腰围趋势，也看动作质量和力量表现。',button(`${I('plus',15)}记录体测`,'data-action="body"','primary'))}<div class="stats-row progress-stats"><div class="stat"><div class="stat-label">最近体重</div><div class="stat-value">${fmt(latestWeight())}<small>kg</small></div><div class="stat-foot">${trend.delta===null?'至少两次记录后比较':`较首次${trend.delta>0?'+':''}${fmt(trend.delta)}kg`}</div></div><div class="stat"><div class="stat-label">完整训练</div><div class="stat-value">${count}<small>次</small></div><div class="stat-foot">另有${state.history.length-count}次部分训练</div></div><div class="stat"><div class="stat-label">实际完成</div><div class="stat-value">${sets}<small>组</small></div><div class="stat-foot">只统计已打勾的正式组</div></div></div><section class="card"><div class="section-head"><h2>体重趋势</h2><span class="chip neutral">阶段参考 ${state.profile.goal} kg</span></div><div class="chart-box">${weightChart()}</div><p class="caption">体重会受水分等因素波动。阶段体重仅供参考，不是完成任务的硬性要求；目标图不能保证复制。</p></section><div class="equal-cols mt"><section class="card"><div class="section-head"><h2>训练历史</h2>${button('导出CSV','data-action="export-csv"','small')}</div>${state.history.length?state.history.slice().reverse().map(s=>`<div class="history-row"><div class="history-badge">${I(s.completed?'check':'dumbbell',18)}</div><div class="entry-text"><strong>${E(s.title)}</strong><p>${s.date} · 第${s.week}周 · ${C.sessionStats(s).done}/${C.sessionStats(s).total}组${s.completed?'':' · 部分完成'}</p></div><button class="small-arrow" data-history="${E(s.logId)}" aria-label="查看训练详情">${I('arrow',16)}</button></div>`).join(''):`<div class="empty">${I('dumbbell',30)}完成训练后，这里会留下你的真实记录。</div>`}</section><section class="card"><div class="section-head"><h2>体测记录</h2><span class="muted">kg / cm</span></div>${state.body.length?trend.list.slice().reverse().map(b=>`<div class="body-row"><div class="entry-text"><strong>${fmt(b.weight)} kg${b.waist?` · 腰围${fmt(b.waist)} cm`:''}</strong><p>${b.date}</p></div><button class="text-delete" data-delete-body="${b.date}" aria-label="删除${b.date}体测">${I('trash',16)}</button></div>`).join(''):`<div class="empty">主睡眠醒来、如厕后、进食前，<br>在相近条件下记录更方便比较。</div>`}</section></div>${footer()}`;}
function renderWorkout(){const s=state.active;if(!s)return `<div class="card empty">当前没有进行中的训练。${button('返回今日训练','data-nav="today"')}</div>`;const stats=C.sessionStats(s);return `<div class="workout-page">${pageTitle('FOCUS ON THIS SET','练好眼前这一组。','重量、次数自动保存。跳出去看视频，回来可以继续。',button(`${I('back',14)}收起`,'data-nav="today"','small'))}<div class="workout-header"><div><span class="chip dark">第${s.week}周 · 正式训练</span><h2 style="margin-top:9px">${E(s.title)}</h2><p>热身5–10分钟后开始，首次重量从轻尝试。</p></div><div style="text-align:right"><strong>${stats.done} / ${stats.total}<small> 组</small></strong><div class="bar"><span style="width:${pct(stats.done,stats.total)}%"></span></div></div></div><div class="workout-tools"><span class="muted small">RIR = 做完后还能标准完成的次数</span>${button(`${I('clock',14)}休息90秒`,'data-rest="90"','small')}</div><div class="workout-cards">${s.items.map((it,ei)=>{const e=D.exercises[it.id],last=C.lastSets(state.history,it.id);return `<section class="card workout-card"><div class="exercise-head"><span class="session-letter">${String(ei+1).padStart(2,'0')}</span><div style="flex:1;min-width:0"><h3>${e.name}</h3><span class="small muted">${it.sets.length}组 × ${it.min}–${it.max}${e.timed?'秒':e.perSide?'次/侧':'次'} · 休息${it.rest}秒</span></div><button class="video-btn" data-detail="${it.id}">${I('play',13)}独立教学</button></div><p class="last-record">${last.length?`上次：${last.map(x=>`${x.weight}kg × ${x.reps}${e.timed?'秒':'次'}`).join(' / ')}`:e.bodyweight?'先从自重版本开始，负重记录为0。':'首次记录：从轻重量开始，做完保留2–3次余力。'}</p><div class="set-table"><div class="set-row set-head"><span>组</span><span>${e.loadLabel||(e.bodyweight?'额外负重 kg':'器械标重 kg')}</span><span>${e.timed?'持续秒数':e.perSide?'次数 / 每侧':'次数'}</span><span>RIR</span><span>完成</span></div>${it.sets.map((set,si)=>`<div class="set-row ${set.done?'is-done':''}"><span class="set-num">${si+1}</span><input aria-label="${e.name}第${si+1}组重量" data-input="weight" data-ei="${ei}" data-si="${si}" inputmode="decimal" type="number" min="0" max="1000" step="0.5" placeholder="试重" value="${set.weight}"><input aria-label="${e.name}第${si+1}组${e.timed?'秒数':'次数'}" data-input="reps" data-ei="${ei}" data-si="${si}" inputmode="numeric" type="number" min="1" max="600" step="1" value="${set.reps}"><select aria-label="${e.name}第${si+1}组余力" data-input="rir" data-ei="${ei}" data-si="${si}">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${set.rir===n?'selected':''}>${n===5?'5+':n}</option>`).join('')}</select><button class="check-set" data-set-check="${ei}:${si}" aria-label="${e.name}第${si+1}组完成" aria-pressed="${set.done}">${I('check',18)}</button></div>`).join('')}</div><p class="set-note">${e.cues[0]} <button class="btn ghost small" style="min-height:24px;padding:0" data-detail="${it.id}">查看要点</button></p></section>`;}).join('')}</div><div class="session-footer"><p class="workout-help">不必为了完成表格忍痛。部分完成也可以保存；关节刺痛、胸痛、晕厥感或异常呼吸困难时立即停练。</p>${button(`${I('check',18)}保存本次训练`,'data-action="finish"','primary')}</div>${button('放弃本次未保存训练','data-action="discard"','ghost small')}</div>`;}

function showModal(title,body){const m=document.getElementById('modal');m.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-close aria-label="关闭弹窗">${I('close',17)}</button></div><div class="modal-body">${body}</div>`;if(!m.open)m.showModal();}
function closeModal(){document.getElementById('modal').close();}
function field(label,name,value,type='number',extra='',full=false){return `<label class="form-field ${full?'full':''}">${label}<input name="${name}" type="${type}" value="${E(value)}" ${extra}></label>`;}
function formErrors(message){let el=document.getElementById('form-error');if(!el){el=document.createElement('div');el.id='form-error';el.className='form-error';document.querySelector('.modal-body').prepend(el);}el.textContent=message;}
function settings(){const p=state.profile;showModal('个人计划设置',`<form id="profile-form"><div class="form-grid">${field('起始体重（kg）','weight',p.weight,'number','min="30" max="350" step="0.1" required')}${field('身高（cm）','height',p.height,'number','min="100" max="230" step="1" required')}${field('阶段参考体重（kg）','goal',p.goal,'number','min="30" max="350" step="0.1" required')}${field('当前计划周（1–12）','week',p.week,'number','min="1" max="12" step="1" required')}${field('计划开始日期','startDate',p.startDate,'date','required',true)}${field('每日热量目标（kcal）','kcal',p.kcal,'number','min="1000" max="6000" step="10" required')}${field('蛋白质目标（g）','protein',p.protein,'number','min="0" max="350" step="1" required')}${field('脂肪目标（g）','fat',p.fat,'number','min="0" max="250" step="1" required')}${field('碳水目标（g）','carbs',p.carbs,'number','min="0" max="900" step="1" required')}</div><div class="callout">预设是前面讨论的执行起点，不是测得的能量需求。改变周数不会清除历史，也不会自动增加重量。日期不触发自动升级。</div><div class="form-actions"><button type="submit" class="btn primary">保存设置</button></div></form><div class="divider"></div><div class="flex wrap">${button(`${I('download',16)}数据备份`,'data-action="backup"','small')}${button(`${I('info',16)}使用与依据`,'data-action="about"','small')}</div>`);}
function videoDetail(id){const e=D.exercises[id];if(!e)return;const url=state.videoOverrides[id]||e.video;showModal(e.name,`<div class="flex wrap"><span class="chip">${e.group}</span><span class="chip neutral">${e.equipment}</span><span class="chip green">一动作一视频</span></div><h3 style="margin-top:18px;font-size:15px">${state.videoOverrides[id]?'你设置的单动作视频':e.title}</h3><p class="caption">${state.videoOverrides[id]?'用户替换链接，未核对对应动作。':`${e.author} · 核对日期 ${e.checked}`}</p><div class="modal-actions"><a id="video-direct" class="btn primary" href="${E(url)}" target="_blank" rel="noopener noreferrer">${I('play',17)}打开B站单条教学</a>${button(`${I('copy',15)}复制BV号`,`data-copy-bv="${id}"`)}</div><div id="player-slot">${button('在此加载播放器',`data-embed="${id}"`,'small')}<span class="small muted"> 需要联网，不能播放请点上方原站</span></div><div class="divider"></div><h3>练习前看这几条</h3><ul>${e.cues.map(c=>`<li>${c}</li>`).join('')}</ul><div class="callout">视频学习不能替代现场动作检查。器械型号不同，请确认安全挡位、座椅和转轴；示范者的负重不代表你的起始重量。</div><p class="caption">${e.verification} 本软件不下载、缓存或转载视频。视频里的组数、强度和宣传性说法不自动覆盖你的训练计划。</p><details style="margin-top:17px"><summary class="small muted">视频失效？更换对应的单条链接</summary><form id="video-form" data-id="${id}" style="margin-top:12px">${field('仅接受 https://www.bilibili.com/video/BV…/','video',url,'url','required',true)}<div class="form-actions">${button('恢复原链接',`data-reset-video="${id}"`,'small')}<button type="submit" class="btn small primary">保存链接</button></div></form></details>`);}
function mealModal(){showModal('记录一餐',`<form id="meal-form"><div class="form-grid">${field('食物 / 餐次名称','foodName','','text','maxlength="100" placeholder="例如：午餐 · 鸡肉米饭" required',true)}${field('日期','foodDate',C.localDate(),'date','required',true)}${field('热量（kcal）','foodKcal','','number','min="0" max="10000" step="0.1" required')}${field('蛋白质（g）','foodProtein','','number','min="0" max="2000" step="0.1" required')}${field('碳水（g）','foodCarbs','','number','min="0" max="2000" step="0.1" required')}${field('脂肪（g）','foodFat','','number','min="0" max="2000" step="0.1" required')}</div><p class="caption">按标签或可靠食物数据填写；烹调油与酱料也计入。没有自动识别功能，估算值并非实测。</p><div class="form-actions"><button class="btn primary" type="submit">保存饮食</button></div></form>`);}
function bodyModal(){const b=state.body.find(x=>x.date===C.localDate());showModal('记录体测',`<form id="body-form"><div class="form-grid">${field('日期','bodyDate',C.localDate(),'date','required',true)}${field('体重（kg）','bodyWeight',b?.weight??'','number','min="30" max="350" step="0.1" placeholder="例如：99.5" required')}${field('腰围（cm，可留空）','bodyWaist',b?.waist??'','number','min="30" max="250" step="0.1" placeholder="例如：108"')}</div><div class="callout">同一天再次保存会更新当日体测。建议在主睡眠醒来、如厕后、进食前记录；不要用一天的波动决定大幅节食。</div><div class="form-actions"><button class="btn primary" type="submit">保存体测</button></div></form>`);}
function recoveryModal(){const r=state.recovery.find(x=>x.date===C.localDate());showModal('记录恢复状态',`<form id="recovery-form"><div class="form-grid">${field('记录日期','recoveryDate',C.localDate(),'date','required',true)}${field('过去24小时睡眠（小时）','sleep',r?.sleep??'','number','min="0" max="24" step="0.1" required')}<label class="form-field">疲劳程度<select name="fatigue">${[[1,'1 · 精神充足'],[2,'2 · 略有疲劳'],[3,'3 · 一般'],[4,'4 · 明显疲劳'],[5,'5 · 很疲惫']].map(([n,l])=>`<option value="${n}" ${(r?.fatigue??2)===n?'selected':''}>${l}</option>`).join('')}</select></label><label class="form-field full">酸痛 / 倒班 / 其他备注<textarea name="note" rows="3" maxlength="1000" placeholder="例如：昨晚夜班，腿部酸痛，训练顺延。">${E(r?.note||'')}</textarea></label></div><p class="caption">本记录不作医学评估。明显缺觉、疼痛影响动作时，训练可以顺延。</p><div class="form-actions"><button class="btn primary" type="submit">保存恢复记录</button></div></form>`);}
function backupModal(){showModal('数据与备份',`${loadError?button('导出原始存储','data-action="raw-storage"'):''}<p>训练、饮食和体测只保存在当前浏览器。清理浏览器、换设备或更换打开地址可能丢失记录；请定期导出。</p><div class="mini-grid"><div class="mini-card"><div><small>训练记录</small><strong>${state.history.length} 条</strong></div></div><div class="mini-card"><div><small>体测 / 饮食</small><strong>${state.body.length} / ${state.meals.length} 条</strong></div></div></div><div class="modal-actions">${button(`${I('download',16)}导出完整备份`,'data-action="export-json"','primary')}${button(`${I('upload',16)}导入备份`,'data-action="import-json"')}</div>${button('导出训练CSV','data-action="export-csv"','small')}<div class="callout">完整备份为JSON，能恢复个人目标、历史记录、未完成训练、做饭设置和菜谱收藏。旧版备份也可导入，做饭部分使用默认值。导入会先校验，再征求确认覆盖；不会与已有记录自动合并。休息倒计时不随导入恢复。</div><div class="divider"></div>${button('清空本地数据','data-action="reset-confirm"','danger small')}`);}
function aboutModal(){showModal('使用说明与训练依据',`<h3>这是什么版本？</h3><p class="caption">练迹 v1.1 是可本地运行的网页版，不是已上架App。没有账号、云同步、后台提醒或Apple健康读取。应用本身无第三方依赖；仅点击视频时联网。</p><h3 style="margin-top:20px">先完成，而不是急着升级</h3><p class="caption">默认100kg、176cm；1–2周每周2练，3–4周每周3练，5–12周每周4练。点击周数可预览，需手动设为当前周。恢复不够时保持2–3练也可以。基础全身训练先用熟悉动作，后期上下肢分化不是强制要求。</p><div class="callout warning"><b>立即停止的信号</b><br>胸痛、晕厥感、异常呼吸困难或关节锐痛，立即停止；严重或持续症状及时就医。若存在未评估的疾病或既往伤病，应先确认是否适宜训练。软件不是诊断或医疗处方。</div><h3 style="margin-top:20px">来源与范围</h3><p class="caption">以下资料支持一般训练、记录与恢复原则；本软件的具体动作编排和营养预设是根据本次需求设计，不是来源逐字给出的个人处方。未从图片推断体脂，也不保证复刻AI身材。</p><div class="source-list" style="margin-top:14px">${D.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label} ↗</a>`).join('')}</div><p class="caption">教学资源保留原站链接与作者标识。只核对公开页面标题/动作对应，未审看全片或保证日后可用。程序完成测试不等于视频在所有手机和网络实播通过。</p>`);}
function historyModal(id){const s=state.history.find(x=>x.logId===id);if(!s)return;showModal(E(s.title),`<p>${s.date} · 第${s.week}周 · ${s.completed?'完整训练':'部分训练'} · 实际完成${C.sessionStats(s).done}组</p>${s.items.map(it=>{const e=D.exercises[it.id];return `<div style="margin-top:17px"><h3>${e.name}</h3><p class="caption">${it.sets.map((r,i)=>`第${i+1}组：${r.done?`${r.weight}kg × ${r.reps}${e.timed?'秒':e.perSide?'次/侧':'次'}，RIR ${r.rir}`:'未完成'}`).join('<br>')}</p></div>`;}).join('')}<p class="caption">哑铃重量按单只记录，自重动作的0kg表示没有额外负重；器械标重不可跨器械直接比较。</p><div class="form-actions">${button('删除这次记录',`data-delete-history="${E(id)}"`,'danger small')}</div>`);}
function startSession(key,confirmed=false){const match=/^w(\d+)-(\d+)$/.exec(key);if(!match)return;const w=+match[1],s=C.plan(w)[+match[2]];if(!s)return;if(state.active){if(state.active.key===key){page='workout';closeModal();render();return;}showModal('已有进行中的训练',`<p>你还有“${E(state.active.title)}”未保存。先继续或保存那次训练，避免覆盖已有组数。</p><div class="form-actions">${button('继续训练','data-action="resume"','primary')}</div>`);return;}
 if(w!==state.profile.week&&!confirmed){showModal('切换训练阶段',`<p>即将从第${state.profile.week}周切换到第${w}周，并开始“${s.title}”。这不是必须按日历完成的升级。</p><div class="callout">确认已经适应当前训练、恢复良好，再增加频率。不适应时继续当前阶段。</div><div class="form-actions">${button('确认切换并开始',`data-confirm-start="${key}"`,'primary')}</div>`);return;}
 state.profile.week=w;previewWeek=w;state.active=C.newSession(s,state.history);save();closeModal();page='workout';render();window.scrollTo(0,0);
}
function finishSession(partial=false){if(!state.active)return;const st=C.sessionStats(state.active);if(!st.done){toast('至少完成并记录一组，才能保存训练。');return;}if(st.done<st.total&&!partial){showModal('保存已经完成的部分？',`<p>目前完成 ${st.done} / ${st.total} 组。保存后会标记为“部分训练”，不会算作整节完成。</p><div class="form-actions">${button('继续练','data-action="resume"')}${button('保存部分训练','data-action="finish-partial"','primary')}</div>`);return;}
 state.history.push({...JSON.parse(JSON.stringify(state.active)),logId:uid(),endedAt:Date.now(),completed:st.done===st.total});state.active=null;state.timer=null;save();closeModal();page='today';render();window.scrollTo(0,0);toast('已保存训练。认真练过的每一组都算数。');}
function uid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function startTimer(seconds){state.timer={endAt:Date.now()+seconds*1000,alerted:false};save();renderTimer();}
function renderTimer(){const el=document.getElementById('timer');if(!state.timer){el.hidden=true;return;}el.hidden=false;const sec=C.remaining(state.timer),paused=state.timer.paused!=null;const time=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;el.innerHTML=`<div class="flex">${I('clock',22)}<div><div class="timer-label">${paused?'已暂停':sec?'组间休息':'准备好再开始下一组'}</div><div class="timer-value ${sec?'':'finished'}">${sec?time:'休息结束'}</div></div></div><div class="timer-controls"><button data-timer="add" aria-label="休息增加30秒">+30s</button><button data-timer="pause" aria-label="${paused?'继续':'暂停'}倒计时">${I(paused?'play':'pause',16)}</button><button data-timer="close" aria-label="关闭休息计时">${I('close',17)}</button></div>`;
 if(sec===0&&!paused&&!state.timer.alerted){state.timer.alerted=true;save();toast('休息时间到，准备好后再开始下一组。');}}
function download(name,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exportCSV(){const q=x=>{let s=String(x??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const rows=[['日期','周数','训练','动作','组','重量kg（哑铃单只）','次数或秒数','RIR','完成状态']];for(const s of state.history)for(const it of s.items)it.sets.forEach((r,i)=>{if(r.done)rows.push([s.date,s.week,s.title,D.exercises[it.id].name,i+1,r.weight,r.reps,r.rir,s.completed?'完整训练':'部分训练']);});download(`练迹-训练记录-${C.localDate()}.csv`,'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function navigate(target){page=target;if(target==='plan')previewWeek=state.profile.week;render();window.scrollTo(0,0);}
let pendingImport=null;
function restoreBackup(){
 if(!pendingImport)return;
 const previousLoadError=loadError;
 loadError=false;
 try{saveCooking(pendingImport);}catch(e){loadError=previousLoadError;formErrors(e.message);return;}
 pendingImport=null;cookResult=null;cookConfig=null;recipeToLog=null;closeModal();previewWeek=state.profile.week;page='today';render();toast('已恢复备份。');
}
document.addEventListener('click',event=>{
 const node=event.target.closest('button,a[data-action]');if(!node)return;
 if(node.hasAttribute('data-close')){closeModal();return;}
 if(node.dataset.nav){navigate(node.dataset.nav);return;}
 if(node.dataset.start){startSession(node.dataset.start);return;}
 if(node.dataset.confirmStart){startSession(node.dataset.confirmStart,true);return;}
 if(node.dataset.detail){videoDetail(node.dataset.detail);return;}
 if(node.dataset.week){previewWeek=+node.dataset.week;render();return;}
 if(node.dataset.group){videoGroup=node.dataset.group;render();return;}
 if(node.dataset.history){historyModal(node.dataset.history);return;}
 if(node.dataset.copyBv){const id=node.dataset.copyBv,url=state.videoOverrides[id]||D.exercises[id].video,bv=url.match(/BV[A-Za-z0-9]{10}/)[0];copyText(bv);return;}
 if(node.dataset.embed){const id=node.dataset.embed,url=state.videoOverrides[id]||D.exercises[id].video,bv=url.match(/BV[A-Za-z0-9]{10}/)[0];document.getElementById('player-slot').innerHTML=`<iframe class="video-frame" title="${E(D.exercises[id].name)}教学视频" src="https://player.bilibili.com/player.html?bvid=${bv}&autoplay=0&danmaku=0" allow="fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><p class="caption">如播放器受平台限制，请用上方按钮打开原站。</p>`;return;}
 if(node.dataset.resetVideo){delete state.videoOverrides[node.dataset.resetVideo];save();videoDetail(node.dataset.resetVideo);return;}
 if(node.dataset.setCheck){const [ei,si]=node.dataset.setCheck.split(':').map(Number),r=state.active?.items[ei]?.sets[si];if(!r)return;if(!r.done&&(r.weight===''||r.reps<=0)){toast('先填写本组重量和次数；自重动作填0kg。');return;}r.done=!r.done;if(r.done)startTimer(state.active.items[ei].rest);save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
 if(node.dataset.rest){startTimer(+node.dataset.rest);return;}
 if(node.dataset.timer){const t=state.timer;if(!t)return;const a=node.dataset.timer,sec=C.remaining(t);if(a==='close')state.timer=null;else if(a==='add'){if(t.paused!=null)t.paused+=30;else t.endAt=Date.now()+(sec+30)*1000;t.alerted=false;}else if(a==='pause'){if(t.paused!=null){t.endAt=Date.now()+t.paused*1000;delete t.paused;}else{t.paused=sec;delete t.endAt;}}save();renderTimer();return;}
 if(node.dataset.deleteMeal){const id=node.dataset.deleteMeal;showModal('删除这条饮食记录？',`<p>删除后不能撤销，请确认。</p><div class="form-actions">${button('确认删除',`data-confirm-meal="${E(id)}"`,'danger')}</div>`);return;}
 if(node.dataset.confirmMeal){state.meals=state.meals.filter(x=>x.id!==node.dataset.confirmMeal);save();closeModal();render();return;}
 if(node.dataset.deleteBody){const date=node.dataset.deleteBody;showModal('删除这条体测？',`<p>将删除${date}的体重和腰围，不能撤销。</p><div class="form-actions">${button('确认删除',`data-confirm-body="${date}"`,'danger')}</div>`);return;}
 if(node.dataset.confirmBody){state.body=state.body.filter(x=>x.date!==node.dataset.confirmBody);save();closeModal();render();return;}
 if(node.dataset.deleteHistory){showModal('删除训练记录？',`<p>这次训练及其组数会从统计中删除，不能撤销。</p><div class="form-actions">${button('确认删除',`data-confirm-history="${E(node.dataset.deleteHistory)}"`,'danger')}</div>`);return;}
 if(node.dataset.confirmHistory){state.history=state.history.filter(x=>x.logId!==node.dataset.confirmHistory);save();closeModal();render();return;}
 const act=node.dataset.action;
 if(act==='settings')settings();else if(act==='backup')backupModal();else if(act==='about')aboutModal();else if(act==='meal')mealModal();else if(act==='body')bodyModal();else if(act==='recovery')recoveryModal();
 else if(act==='resume'){closeModal();page='workout';render();window.scrollTo(0,0);}
 else if(act==='finish')finishSession();else if(act==='finish-partial')finishSession(true);
 else if(act==='adopt-week'){showModal(`使用第${previewWeek}周计划？`,`<p>选择周数不会自动加重量。适应良好再升级；恢复不足可以继续原周。</p><div class="form-actions">${button('确认使用','data-action="adopt-confirm"','primary')}</div>`);}
 else if(act==='adopt-confirm'){state.profile.week=previewWeek;save();closeModal();render();toast('已调整当前执行周。');}
 else if(act==='export-json'){download(`练迹-完整备份-${C.localDate()}.json`,JSON.stringify(state,null,2),'application/json');toast('备份文件已生成，请妥善保管。');}
 else if(act==='export-csv')exportCSV();
 else if(act==='import-json')document.getElementById('import-file').click();
 else if(act==='import-confirm'&&pendingImport)restoreBackup();
 else if(act==='reset-confirm'){showModal('清空所有本地数据？','<p>将清除训练、体测、饮食、恢复、菜谱收藏和自定义设置。此操作不可撤销，建议先导出备份。</p><div class="form-actions">'+button('导出备份','data-action="export-json"')+button('确认清空','data-action="reset-now"','danger')+'</div>');}
 else if(act==='reset-now'){state=C.defaults();loadError=false;cookResult=null;cookConfig=null;recipeToLog=null;save();closeModal();previewWeek=1;page='today';render();toast('已清空本地数据。');}
 else if(act==='discard'){showModal('放弃进行中的训练？','<p>本次未保存的组数将丢失；已经保存的历史不受影响。</p><div class="form-actions">'+button('保留并继续','data-action="resume"')+button('确认放弃','data-action="discard-confirm"','danger')+'</div>');}
 else if(act==='discard-confirm'){state.active=null;state.timer=null;save();closeModal();page='today';render();}
 else if(act==='all-meals'){showModal('全部饮食记录',state.meals.length?state.meals.slice().reverse().map(m=>`<div class="meal-row"><div class="entry-text"><strong>${E(m.name)}</strong><p>${m.date} · ${fmt(m.kcal)}kcal · 蛋白${fmt(m.protein)}g</p></div><button class="text-delete" data-delete-meal="${E(m.id)}" aria-label="删除记录">${I('trash',16)}</button></div>`).join(''):'<div class="empty">尚无记录。</div>');}
});
function updateSetField(n,final=false){
 const r=state.active?.items[+n.dataset.ei]?.sets[+n.dataset.si];if(!r)return;
 const key=n.dataset.input,value=n.value===''&&key==='weight'?'':Number(n.value),max=key==='weight'?1000:key==='reps'?600:5;
 if(value!==''&&(!Number.isFinite(value)||value<0||value>max||(key!=='weight'&&!Number.isInteger(value)))){if(final){n.value=r[key];toast('请输入合理的非负数值，次数使用整数。');}return;}
 r[key]=value;
 if(r.done&&(r.weight===''||r.reps<=0)){r.done=false;const row=n.closest('.set-row'),check=row?.querySelector('[data-set-check]');row?.classList.remove('is-done');check?.setAttribute('aria-pressed','false');}
 save();
 if(final&&page==='workout'){const stats=C.sessionStats(state.active),head=document.querySelector('.workout-header>div:last-child');if(head)head.innerHTML=`<strong>${stats.done} / ${stats.total}<small> 组</small></strong><div class="bar"><span style="width:${pct(stats.done,stats.total)}%"></span></div>`;}
}
document.addEventListener('input',event=>{const n=event.target;if(n.id==='video-search'){videoQuery=n.value;document.getElementById('video-grid').innerHTML=videoTiles();}else if(n.dataset.input)updateSetField(n);});
document.addEventListener('change',event=>{if(event.target.dataset.input)updateSetField(event.target,true);});
document.addEventListener('submit',event=>{const form=event.target;if(!['profile-form','meal-form','body-form','recovery-form','video-form'].includes(form.id))return;event.preventDefault();const f=new FormData(form),num=k=>Number(f.get(k)),str=k=>String(f.get(k)||'').trim();try{if(loadError)throw new Error('原有数据异常，已阻止覆盖；请先导出原始存储或导入有效备份。');
 if(form.id==='profile-form'){const profile={};for(const k of ['weight','height','goal','week','kcal','protein','fat','carbs'])profile[k]=num(k);profile.startDate=str('startDate');C.validateBackup({...state,profile});state.profile=profile;previewWeek=profile.week;}
 if(form.id==='meal-form'){const m={id:uid(),date:str('foodDate'),name:str('foodName'),kcal:num('foodKcal'),protein:num('foodProtein'),carbs:num('foodCarbs'),fat:num('foodFat')};if(!m.name)throw new Error('请填写食物名称');C.validateBackup({...state,meals:[...state.meals,m]});state.meals.push(m);}
 if(form.id==='body-form'){const b={date:str('bodyDate'),weight:num('bodyWeight'),waist:str('bodyWaist')?num('bodyWaist'):null};if(b.date>C.localDate())throw new Error('体测日期不能晚于今天');const body=state.body.filter(x=>x.date!==b.date).concat(b);C.validateBackup({...state,body});state.body=body;}
 if(form.id==='recovery-form'){const r={date:str('recoveryDate'),sleep:num('sleep'),fatigue:num('fatigue'),note:str('note')};const recovery=state.recovery.filter(x=>x.date!==r.date).concat(r);C.validateBackup({...state,recovery});state.recovery=recovery;}
 if(form.id==='video-form'){let url=str('video');if(!url.endsWith('/'))url+='/';if(!C.isVideoUrl(url))throw new Error('只接受B站独立视频地址，格式：https://www.bilibili.com/video/BV…/；不支持合集、搜索或短链接。');state.videoOverrides[form.dataset.id]=url;save();videoDetail(form.dataset.id);toast('已保存单条视频链接，请自行确认动作对应。');return;}
 save();closeModal();render();toast('已保存。');
 }catch(e){formErrors(e.message);}});
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制：'+text);}catch(e){showModal('复制视频编号',`<p>当前浏览器不允许自动复制，请长按下方编号：</p><input class="search-box" style="width:100%;margin-top:15px" readonly value="${E(text)}" onfocus="this.select()">`);}}
document.getElementById('import-file').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;if(file.size>5*1024*1024){toast('备份文件过大，请使用5MB以内的JSON文件。');return;}try{pendingImport=C.validateBackup(JSON.parse(await file.text()));showModal('确认恢复这份备份？',`<p>包含 ${pendingImport.history.length} 条训练、${pendingImport.body.length} 条体测和 ${pendingImport.meals.length} 条饮食。另有 ${pendingImport.cooking.favorites.length} 道收藏菜谱。将覆盖当前浏览器全部练迹数据。</p><div class="form-actions">${button('先导出现有数据','data-action="export-json"')}${button('确认覆盖恢复','data-action="import-confirm"','primary')}</div>`);}catch(e){pendingImport=null;showModal('备份未导入',`<p>${E(e.message)}</p><div class="callout">当前数据未被更改。请使用练迹导出的完整JSON备份。</div>`);}});
document.getElementById('modal').addEventListener('close',()=>{document.getElementById('modal').innerHTML='';});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderTimer();});
setInterval(renderTimer,1000);
render();
if(loadError){showModal('原有数据暂未载入','<p>浏览器内的数据格式异常，已暂时显示默认界面；原存储尚未覆盖。建议先保存原始内容再恢复备份，已阻止继续保存覆盖原存储，请先导出原始内容并恢复有效备份。</p><div class="form-actions">'+button('导出原始存储','data-action="raw-storage"')+button('导入有效备份','data-action="import-json"')+'</div>');}
document.addEventListener('click',e=>{if(e.target.closest('[data-action="raw-storage"]')){let text='';try{text=localStorage.getItem(KEY)||'';}catch(_){}download('练迹-原始存储.txt',text,'text/plain');}});
})();

</script>
</body></html>
